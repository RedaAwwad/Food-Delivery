<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password · FOOD-DELIVERY</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --brand-400:#ff8534; --brand-500:#ff6a1a; --brand-600:#ef5106;
    --green-500:#0fae6e; --red-500:#e23744;
    --text:#1a1c1f; --text-2:#5a6270; --text-3:#9aa1ad;
    --surface:#fff; --surface-2:#f5f6f8; --border:#ececf0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Plus Jakarta Sans",system-ui,sans-serif; color:var(--text);
    min-height:100vh; display:grid; place-items:center; padding:24px;
    background:
      radial-gradient(circle at 15% 20%,rgba(255,106,26,.18),transparent 45%),
      radial-gradient(circle at 85% 15%,rgba(123,91,255,.16),transparent 45%),
      radial-gradient(circle at 75% 90%,rgba(15,174,110,.16),transparent 45%),
      #f7f8fa;
  }
  .card{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--border);
    border-radius:28px;padding:42px 38px;box-shadow:0 30px 70px rgba(20,23,28,.14);animation:rise .5s ease;}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .logo{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.4px;margin-bottom:22px;}
  .logo .mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;
    background:linear-gradient(135deg,var(--brand-400),var(--brand-600));box-shadow:0 10px 24px rgba(255,106,26,.35);}
  .logo .mark svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .logo span{color:var(--brand-500);}
  h1{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;text-align:center;}
  .lead{color:var(--text-2);font-size:14.5px;text-align:center;margin-bottom:24px;}
  label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:var(--text-2);}
  .field{margin-bottom:16px;}
  input{width:100%;height:50px;border:1px solid var(--border);border-radius:14px;padding:0 16px;font-size:15px;background:var(--surface-2);outline:none;transition:.2s;font-family:inherit;}
  input:focus{border-color:var(--brand-400);background:var(--surface);box-shadow:0 0 0 4px rgba(255,106,26,.12);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 26px;border-radius:999px;
    font-weight:700;font-size:15px;text-decoration:none;color:#fff;width:100%;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--brand-500),var(--brand-600));box-shadow:0 12px 30px rgba(255,106,26,.32);transition:.2s;font-family:inherit;}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.05);}
  .btn:disabled{opacity:.6;cursor:default;transform:none;}
  .btn.ghost{background:none;color:var(--text);border:1.5px solid var(--border);box-shadow:none;margin-top:12px;}
  .hint{font-size:12px;color:var(--text-3);margin-top:-8px;margin-bottom:16px;}
  .msg{font-size:13.5px;font-weight:600;border-radius:12px;padding:11px 14px;margin-bottom:16px;display:none;}
  .msg.err{display:block;background:rgba(226,55,68,.1);color:var(--red-500);}
  .msg.ok{display:block;background:rgba(15,174,110,.12);color:var(--green-500);}
  .done{text-align:center;}
  .done .ring{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;position:relative;}
  .done .ring::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,var(--green-500),var(--brand-500),var(--green-500));animation:spin 6s linear infinite;}
  .done .ring .inner{position:relative;z-index:1;width:84px;height:84px;border-radius:50%;background:var(--surface);display:grid;place-items:center;}
  .done svg{width:40px;height:40px;fill:none;stroke:var(--green-500);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}
  .spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;animation:spin 1s linear infinite;}
  .hide{display:none;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="mark"><svg viewBox="0 0 24 24"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6h2l2 5M5.5 17.5 9 9h5l2.5 8.5M9 9l-1-3H6"/></svg></span>FOOD<span>DELIVERY</span></div>

    <div id="formWrap">
      <h1>Set a new password</h1>
      <p class="lead">Choose a strong password to secure your account.</p>
      <div id="msg" class="msg"></div>
      <form id="form">
        <div class="field"><label>New password</label><input id="pw" type="password" placeholder="••••••••" autocomplete="new-password" /></div>
        <p class="hint">At least 8 characters, with an uppercase, lowercase and a number.</p>
        <div class="field"><label>Confirm new password</label><input id="pw2" type="password" placeholder="••••••••" autocomplete="new-password" /></div>
        <button id="submit" class="btn" type="submit">Reset password</button>
      </form>
    </div>

    <div id="doneWrap" class="done hide">
      <div class="ring"><div class="inner"><svg viewBox="0 0 52 52"><path d="M14 27l8 8 16-17"/></svg></div></div>
      <h1>Password updated</h1>
      <p class="lead">You can now sign in with your new password.</p>
      <a class="btn" href="/shop#/login">Sign in</a>
    </div>
  </div>

<script>
  const token = new URLSearchParams(location.search).get("token");
  const form = document.getElementById("form");
  const pw = document.getElementById("pw");
  const pw2 = document.getElementById("pw2");
  const msg = document.getElementById("msg");
  const submit = document.getElementById("submit");
  const formWrap = document.getElementById("formWrap");
  const doneWrap = document.getElementById("doneWrap");

  function showMsg(text, type) { msg.textContent = text; msg.className = "msg " + type; }

  if (!token) showMsg("This reset link is missing its token. Please request a new one.", "err");

  const strong = (v) => /^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}$/.test(v);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.className = "msg";
    if (!token) { showMsg("Invalid reset link.", "err"); return; }
    if (!strong(pw.value)) { showMsg("Password must be 8+ chars with upper, lower and a number.", "err"); return; }
    if (pw.value !== pw2.value) { showMsg("Passwords do not match.", "err"); return; }

    submit.disabled = true;
    const original = submit.textContent;
    submit.innerHTML = '<span class="spinner"></span> Updating…';
    try {
      const res = await fetch("/api/v1/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, newPassword: pw.value }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) { formWrap.classList.add("hide"); doneWrap.classList.remove("hide"); }
      else { showMsg(data?.error?.message || data?.message || "Could not reset password.", "err"); submit.disabled = false; submit.textContent = original; }
    } catch (err) {
      showMsg("We couldn't reach the server. Please try again.", "err");
      submit.disabled = false; submit.textContent = original;
    }
  });
</script>
</body>
</html>
