services:
  node-app:
    container_name: express-node-app-container
    build: .
    volumes:
      - ./src:/app/src
    ports:
      - "4000:4000"
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql://postgres:0000@postgres:5433/food-delivery?schema=public

    depends_on:
      - postgres
    command: ["npm", "run", "dev"]
  postgres:
    image: postgres
    restart: always
    container_name: postgres-db
    ports:
      - "5433:5433"
    volumes:
      - postgres-db:/var/lib/postgresql
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: example
      POSTGRES_DB: food-delivery

volumes:
  postgres-db:
